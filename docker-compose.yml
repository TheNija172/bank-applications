services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - "49542:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: 57f9b540e4b2f21c0ae9217496e23db08af15db1a088ce87b9628e27165db7fe